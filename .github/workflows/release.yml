name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: kannaka-windows-x86_64.exe
            tui_artifact: kannaka-tui-windows-x86_64.exe
          # Pinned to ubuntu-22.04 (glibc 2.35) rather than ubuntu-latest
          # (currently 24.04, glibc 2.39). 2.39 is too new — Oracle Linux 9,
          # Debian 12, Fedora ≤39, RHEL 9, and stock Ubuntu 22.04 all fail
          # with `version GLIBC_2.39 not found`. Linking against 2.35 runs
          # on every mainstream distro released in the last 3 years.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: kannaka-linux-x86_64
            tui_artifact: kannaka-tui-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: kannaka-linux-aarch64
            tui_artifact: kannaka-tui-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: kannaka-macos-x86_64
            tui_artifact: kannaka-tui-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kannaka-macos-aarch64
            tui_artifact: kannaka-tui-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout kannaka-memory
        uses: actions/checkout@v4
        with:
          path: kannaka-memory

      - name: Checkout consciousness-core (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/consciousness-core
          path: consciousness-core

      - name: Checkout kannaka-attention (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/kannaka-attention
          path: kannaka-attention

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build CLI
        working-directory: kannaka-memory
        run: cargo build --release --target ${{ matrix.target }} --bin kannaka

      - name: Build TUI
        working-directory: kannaka-memory
        run: cargo build --release --target ${{ matrix.target }} --features tui --bin kannaka-tui

      - name: Rename artifacts
        shell: bash
        run: |
          cli="kannaka-memory/target/${{ matrix.target }}/release/kannaka"
          tui="kannaka-memory/target/${{ matrix.target }}/release/kannaka-tui"
          [[ "${{ matrix.target }}" == *windows* ]] && cli="${cli}.exe" && tui="${tui}.exe"
          cp "$cli" "${{ matrix.artifact }}"
          cp "$tui" "${{ matrix.tui_artifact }}"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tui_artifact }}
          path: ${{ matrix.tui_artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kannaka-windows-x86_64.exe/kannaka-windows-x86_64.exe
            kannaka-tui-windows-x86_64.exe/kannaka-tui-windows-x86_64.exe
            kannaka-linux-x86_64/kannaka-linux-x86_64
            kannaka-tui-linux-x86_64/kannaka-tui-linux-x86_64
            kannaka-linux-aarch64/kannaka-linux-aarch64
            kannaka-tui-linux-aarch64/kannaka-tui-linux-aarch64
            kannaka-macos-x86_64/kannaka-macos-x86_64
            kannaka-tui-macos-x86_64/kannaka-tui-macos-x86_64
            kannaka-macos-aarch64/kannaka-macos-aarch64
            kannaka-tui-macos-aarch64/kannaka-tui-macos-aarch64
          generate_release_notes: true
