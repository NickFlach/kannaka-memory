[package]
name = "kannaka-memory"
version = "0.1.0"
edition = "2021"
description = "Hypervector memory system for Kannaka — wave-modulated holographic memory with skip links"
license = "MIT"

[dependencies]
dirs = "5"
rand = "0.8"
rayon = { version = "1", optional = true }
rand_chacha = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
bincode = "1"
ndarray = { version = "0.15", optional = true }
blake3 = { version = "1.5", optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }
# rusqlite removed — sqlite-migrate paradigm deleted
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }
lazy_static = "1.4"
consciousness-core = { path = "../consciousness-core" }

# Audio perception (optional)
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm", "aac"], optional = true }
rustfft = { version = "6", optional = true }
rubato = { version = "0.15", optional = true }

# Video perception (optional) — uses ffmpeg subprocess, no C deps
image = { version = "0.25", optional = true }

# NATS real-time transport (optional) — uses raw TCP protocol (nats crate broken with rand 0.9)

[features]
default = ["hrm", "nats"]
nats = []
mcp = ["tokio", "async-trait"]
audio = ["symphonia", "rustfft", "rubato"]
video = ["image"]
glyph = []
collective = ["rayon"]
hrm = ["ndarray", "blake3"]
# sqlite-migrate feature removed

[[bin]]
name = "research"
path = "src/bin/research.rs"

[[example]]
name = "glyph_demo"
required-features = ["glyph"]

[[bin]]
name = "kannaka-mcp"
path = "src/bin/mcp_server.rs"
required-features = ["mcp"]

[[bin]]
name = "kannaka-recompute-geometry"
path = "src/bin/recompute_geometry.rs"

# hrm-migrate is obsolete (was Dolt→HRM migration); kept for reference
# [[bin]]
# name = "hrm-migrate"
# path = "src/bin/hrm_migrate.rs"
# required-features = ["sqlite-migrate"]

[dev-dependencies]
tempfile = "3"
