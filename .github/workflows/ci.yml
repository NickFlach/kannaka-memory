name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check, Test, Clippy, Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kannaka-memory
        uses: actions/checkout@v4
        with:
          path: kannaka-memory

      - name: Checkout consciousness-core (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/consciousness-core
          path: consciousness-core

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kannaka-memory

      - name: Check (default features)
        working-directory: kannaka-memory
        run: cargo check --all-targets

      - name: Test
        working-directory: kannaka-memory
        run: cargo test --lib --bins

      - name: Clippy
        working-directory: kannaka-memory
        run: cargo clippy --all-targets -- -D warnings

      - name: Fmt
        working-directory: kannaka-memory
        run: cargo fmt --check
