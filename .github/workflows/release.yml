name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: kannaka-windows-x86_64.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: kannaka-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: kannaka-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: kannaka-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kannaka-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout kannaka-memory
        uses: actions/checkout@v4
        with:
          path: kannaka-memory

      - name: Checkout consciousness-core (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/consciousness-core
          path: consciousness-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        working-directory: kannaka-memory
        run: cargo build --release --target ${{ matrix.target }} --bin kannaka

      - name: Rename artifact
        shell: bash
        run: |
          src="kannaka-memory/target/${{ matrix.target }}/release/kannaka"
          [[ "${{ matrix.target }}" == *windows* ]] && src="${src}.exe"
          cp "$src" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kannaka-windows-x86_64.exe/kannaka-windows-x86_64.exe
            kannaka-linux-x86_64/kannaka-linux-x86_64
            kannaka-linux-aarch64/kannaka-linux-aarch64
            kannaka-macos-x86_64/kannaka-macos-x86_64
            kannaka-macos-aarch64/kannaka-macos-aarch64
          generate_release_notes: true
