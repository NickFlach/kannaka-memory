name: Auto-merge curiosity research

# Closes the autonomous-research → automated-improvement loop.
#
# The hourly curiosity loop opens kannaka-curiosity/* PRs (append-only research
# logs + occasionally a param tweak). They used to pile up waiting for a human
# merge — the bottleneck. This workflow merges the GREEN, NOTES-ONLY ones into
# master so the research log lands without a human in the loop.
#
# Safety model:
#   - Only kannaka-curiosity/* branches are touched.
#   - Only merged after ALL checks are green (`gh pr checks` exits 0 = all pass).
#   - SCOPE GUARD (#330): a curiosity PR may ONLY change research notes
#     (experiments/notes/**) and the append-only experiments/results-L{3,4,5,6}.tsv.
#     Code and config reach master a DIFFERENT way — the 02:00 autoresearch
#     param-tuner runs keep/revert experiments and pushes confirmed keepers
#     straight to master. By the time a curiosity PR's param tweak is seen here
#     it is almost always already-in-master or superseded, so auto-merging it
#     would silently REGRESS the tuned parameters (this happened latently with
#     PR #272: alpha=0.13/chiral=0.10 vs master's chiral=0.15/alpha=0.12). Any
#     PR touching paths outside the allowlist is labeled `needs-review` and left
#     open for a human — never auto-merged.
#   - The append-only results-L{3,4,5,6}.tsv conflicts are auto-resolved with the
#     built-in `union` merge driver (exactly the manual flow).
#   - Any PR with a NON-union conflict is skipped and left open — never forced.
#   - Disable by deleting this file or via the Actions tab.

on:
  schedule:
    - cron: '41 */3 * * *'   # every 3h
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write   # needed to create/apply the needs-review label

concurrency:
  group: auto-merge-curiosity
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge green curiosity PRs (notes + append-only TSVs only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name "kannaka-curiosity-bot"
          git config user.email "noreply@github.com"
          printf 'experiments/results-L6.tsv merge=union\nexperiments/results-L5.tsv merge=union\nexperiments/results-L4.tsv merge=union\nexperiments/results-L3.tsv merge=union\n' \
            > .git/info/attributes
          git fetch origin master
          git checkout -B master origin/master

          # Ensure the review label exists (idempotent).
          gh label create needs-review --color FBCA04 \
            --description "Curiosity PR carries code/config; needs a human merge decision" 2>/dev/null || true

          merged=0
          declare -a done_branches=()
          for num in $(gh pr list --state open --limit 100 --json number,headRefName \
                --jq '.[] | select(.headRefName | startswith("kannaka-curiosity/")) | .number' | sort -n); do
            # ── CI gate (issue #468) ──────────────────────────────────────────
            # A bare `gh pr checks "$num"` is NOT a sufficient gate: on a PR with
            # ZERO reported checks it does not fail, so a bot PR could be merged
            # without CI (ci.yml — including the NATS contract conformance test)
            # ever running. Require, from the head commit's checks:
            #   1. every reported check is in a terminal-success bucket
            #      (`pass` or `skipping`) — nothing failing/pending/cancelled, and
            #   2. the CI workflow (ci.yml, `name: CI`) is PRESENT and passed.
            # `--json` prints the check JSON on stdout regardless of the aggregate
            # exit code; we read that and ignore the exit code. Missing/empty
            # output (no checks) falls through to `[]`, which fails the gate
            # (ci_passing == 0) — i.e. it fails CLOSED.
            checks_json=$(gh pr checks "$num" --json workflow,name,state,bucket 2>/dev/null)
            [ -z "$checks_json" ] && checks_json='[]'
            not_passing=$(echo "$checks_json" | jq '[.[] | select(.bucket != "pass" and .bucket != "skipping")] | length')
            ci_passing=$(echo "$checks_json" | jq '[.[] | select(.workflow == "CI" and .bucket == "pass")] | length')
            if [ "${not_passing:-1}" -ne 0 ]; then
              echo "skip #$num — not all checks green yet (non-passing: $not_passing)"
              continue
            fi
            if [ "${ci_passing:-0}" -eq 0 ]; then
              echo "skip #$num — required CI workflow has not passed on the head commit"
              continue
            fi

            # SCOPE GUARD (#330): allow only research notes + append-only result TSVs.
            offlimits=$(gh pr view "$num" --json files --jq '
              .files[].path
              | select((startswith("experiments/notes/")
                        or . == "experiments/results-L6.tsv"
                        or . == "experiments/results-L5.tsv"
                        or . == "experiments/results-L4.tsv"
                        or . == "experiments/results-L3.tsv") | not)')
            if [ -n "$offlimits" ]; then
              echo "::notice title=Needs review::#$num changes non-note files; routed to a human"
              # Label + comment ONCE (don't re-spam on every 3h run).
              if ! gh pr view "$num" --json labels --jq '.labels[].name' | grep -qx needs-review; then
                gh pr edit "$num" --add-label needs-review 2>/dev/null || true
                body=$(printf '%s\n' \
                  'Auto-merge skipped by policy (issue #330): this curiosity PR changes files outside experiments/notes/ and the append-only results-L{3,4,5,6}.tsv:' \
                  '' '```' "$offlimits" '```' '' \
                  'Code and config reach master only through the autoresearch param-tuner (which pushes confirmed keepers directly); curiosity PRs contribute research notes and TSV rows only. A maintainer should check whether this code is already in master or superseded (the usual case), then keep the note and close, or merge deliberately.')
                gh pr comment "$num" --body "$body" 2>/dev/null || true
              fi
              continue
            fi

            br=$(gh pr view "$num" --json headRefName --jq .headRefName)
            git fetch origin "$br" || { echo "fetch failed for #$num ($br)"; continue; }
            if git merge --no-ff FETCH_HEAD -m "Auto-merge PR #$num ($br): curiosity research"; then
              echo "merged #$num ($br)"
              merged=$((merged + 1))
              done_branches+=("$br")
            else
              git merge --abort 2>/dev/null || true
              echo "::notice title=Left for review::#$num ($br) has a non-union conflict — not auto-merged"
            fi
          done

          if [ "$merged" -gt 0 ]; then
            git push origin master
            echo "pushed $merged merge(s) to master"
            for b in "${done_branches[@]}"; do
              git push origin --delete "$b" 2>/dev/null && echo "deleted $b" || true
            done
          else
            echo "no green curiosity PRs to merge"
          fi
