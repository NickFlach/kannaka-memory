# ADR-0042 Phase 3 — append this block to Oracle1's standalone /etc/nats/nats.conf.
# A leafnodes LISTENER does NOT cluster JetStream: O1's JS stays standalone and its
# $G streams stay intact. Restart nats after appending; verify `stream ls` still
# shows all streams. Replace __LEAF_TOKEN__ (openssl rand -hex 12); it must match
# Oracle2's remote URL. Keep the token out of git.
leafnodes {
  listen: 0.0.0.0:6222
  authorization { user: leaf, password: "__LEAF_TOKEN__" }
}
