name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: kannaka-windows-x86_64.exe
          # Pinned to ubuntu-22.04 (glibc 2.35) rather than ubuntu-latest
          # (currently 24.04, glibc 2.39). 2.39 is too new — Oracle Linux 9,
          # Debian 12, Fedora ≤39, RHEL 9, and stock Ubuntu 22.04 all fail
          # with `version GLIBC_2.39 not found`. Linking against 2.35 runs
          # on every mainstream distro released in the last 3 years.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: kannaka-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: kannaka-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: kannaka-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kannaka-macos-aarch64
    # TUI binary moved to NickFlach/kannaka-tui (extracted at v0.5.12).
    # That repo has its own Release workflow producing kannaka-tui-* artifacts.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout kannaka-memory
        uses: actions/checkout@v4
        with:
          path: kannaka-memory

      - name: Checkout consciousness-core (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/consciousness-core
          path: consciousness-core

      - name: Checkout kannaka-attention (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/kannaka-attention
          path: kannaka-attention

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build CLI
        working-directory: kannaka-memory
        run: cargo build --release --target ${{ matrix.target }} --bin kannaka

      - name: Rename artifact + emit SHA-256 sidecar (ADR-0029 Phase 4a)
        shell: bash
        # The sidecar is a `<artifact>.sha256` file in the same release
        # so `kannaka update` can verify the download before atomically
        # replacing the running binary. Format matches `sha256sum`:
        #   <hex-digest>  <filename>
        run: |
          cli="kannaka-memory/target/${{ matrix.target }}/release/kannaka"
          [[ "${{ matrix.target }}" == *windows* ]] && cli="${cli}.exe"
          cp "$cli" "${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            # macOS shipped without sha256sum until very recent versions
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload SHA-256 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}.sha256
          path: ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kannaka-windows-x86_64.exe/kannaka-windows-x86_64.exe
            kannaka-windows-x86_64.exe.sha256/kannaka-windows-x86_64.exe.sha256
            kannaka-linux-x86_64/kannaka-linux-x86_64
            kannaka-linux-x86_64.sha256/kannaka-linux-x86_64.sha256
            kannaka-linux-aarch64/kannaka-linux-aarch64
            kannaka-linux-aarch64.sha256/kannaka-linux-aarch64.sha256
            kannaka-macos-x86_64/kannaka-macos-x86_64
            kannaka-macos-x86_64.sha256/kannaka-macos-x86_64.sha256
            kannaka-macos-aarch64/kannaka-macos-aarch64
            kannaka-macos-aarch64.sha256/kannaka-macos-aarch64.sha256
          generate_release_notes: true
