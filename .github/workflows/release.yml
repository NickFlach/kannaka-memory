name: Release

on:
  push:
    tags: ['v*']

# Push Node-20-based actions (download-artifact@v4) onto Node 24 ahead of
# GitHub's forced cutover (2026-06-02) and Node 20 removal (2026-09-16). This
# avoids a risky major bump of the artifact actions, which must stay compatible
# with the (un-flagged, already Node-24) upload-artifact@v4 in the build jobs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: kannaka-windows-x86_64.exe
            acp_artifact: kannaka-acp-windows-x86_64.exe
          # MUSL static binaries — NO glibc dependency at all. The previous
          # glibc-gnu builds failed at runtime on any distro with an older
          # glibc than the build host (e.g. ubuntu-22.04 → GLIBC_2.35, but
          # Oracle Linux 9 / RHEL 9 ship glibc 2.34 → "version GLIBC_2.35 not
          # found"). A musl-static `kannaka` runs on every Linux regardless of
          # glibc version. Artifact names are unchanged so installer URLs hold.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            artifact: kannaka-linux-x86_64
            acp_artifact: kannaka-acp-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            artifact: kannaka-linux-aarch64
            acp_artifact: kannaka-acp-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: kannaka-macos-x86_64
            acp_artifact: kannaka-acp-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kannaka-macos-aarch64
            acp_artifact: kannaka-acp-macos-aarch64
    # TUI binary moved to NickFlach/kannaka-tui (extracted at v0.5.12).
    # That repo has its own Release workflow producing kannaka-tui-* artifacts.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout kannaka-memory
        uses: actions/checkout@v4
        with:
          path: kannaka-memory

      # Which sibling versions does THIS release compile against?
      #
      # Both are `path` dependencies, and a path dep takes whatever is on disk
      # — the lockfile RECORDS its version but does not pin it. These checkouts
      # named no `ref`, so every release built against whatever the siblings'
      # default branches happened to be at that moment. Three consequences, all
      # of which were live:
      #
      #   * releases were not reproducible — rebuilding a tag today produces a
      #     different binary than when it was cut;
      #   * `cc-release-cascade.yml` bumps `Cargo.lock` to signal a new
      #     consciousness-core, which changed nothing here, so the cascade ran
      #     green and had no effect (observed on the v0.6.0 tag);
      #   * anything merged to a sibling's default branch shipped in the next
      #     kannaka release with no bump, changelog or tag.
      #
      # Reading the version out of Cargo.lock makes the lockfile prescriptive
      # instead of descriptive, which is what everything downstream already
      # assumes it is — and it is what makes the cascade's PR mean something.
      - name: Resolve sibling versions from Cargo.lock
        id: siblings
        shell: bash
        working-directory: kannaka-memory
        run: |
          set -euo pipefail
          ver() {
            # The line after `name = "<crate>"` in the lock's package stanza.
            v=$(grep -A1 "^name = \"$1\"\$" Cargo.lock | grep '^version = ' | head -1 | cut -d'"' -f2)
            if [ -z "$v" ]; then
              echo "::error::could not resolve $1 version from Cargo.lock" >&2
              exit 1
            fi
            echo "$v"
          }
          cc=$(ver consciousness-core)
          ka=$(ver kannaka-attention)
          echo "cc=v${cc}" >> "$GITHUB_OUTPUT"
          echo "ka=v${ka}" >> "$GITHUB_OUTPUT"
          echo "pinning consciousness-core v${cc}, kannaka-attention v${ka}"

      # A missing tag FAILS the release rather than falling back to the default
      # branch. A fallback would restore the exact silence this pin exists to
      # end: the build would go green having shipped an unreleased sibling, and
      # the operator would find out from a version mismatch weeks later — which
      # is how this was found in the first place.
      - name: Checkout consciousness-core (pinned to the lockfile)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/consciousness-core
          ref: ${{ steps.siblings.outputs.cc }}
          path: consciousness-core

      - name: Checkout kannaka-attention (pinned to the lockfile)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/kannaka-attention
          ref: ${{ steps.siblings.outputs.ka }}
          path: kannaka-attention

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Sets up the cross/musl toolchain + linker env for the linux-musl targets
      # (handles both x86_64- and aarch64-unknown-linux-musl, native build — so
      # the sibling path-deps checked out as ../consciousness-core and
      # ../kannaka-attention are still visible, unlike a docker-based cross).
      - name: Set up musl cross toolchain (linux)
        if: contains(matrix.target, 'linux-musl')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      # Both binaries in one invocation so they share a dependency build.
      # `kannaka-acp` serves the HRM as an ACP agent (ADR-0052 Tier 1); it must
      # ship in the release or registering the Buzz harness would require every
      # user to `cargo install` from source.
      - name: Build CLI + ACP agent
        working-directory: kannaka-memory
        run: cargo build --release --target ${{ matrix.target }} --bin kannaka --bin kannaka-acp

      - name: Rename artifacts + emit SHA-256 sidecars (ADR-0029 Phase 4a)
        shell: bash
        # The sidecar is a `<artifact>.sha256` file in the same release
        # so `kannaka update` can verify the download before atomically
        # replacing the running binary. Format matches `sha256sum`:
        #   <hex-digest>  <filename>
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          package() {
            src="kannaka-memory/target/${{ matrix.target }}/release/$1${ext}"
            cp "$src" "$2"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$2" > "$2.sha256"
            else
              # macOS shipped without sha256sum until very recent versions
              shasum -a 256 "$2" > "$2.sha256"
            fi
          }
          package kannaka "${{ matrix.artifact }}"
          package kannaka-acp "${{ matrix.acp_artifact }}"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload SHA-256 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}.sha256
          path: ${{ matrix.artifact }}.sha256

      - name: Upload ACP agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.acp_artifact }}
          path: ${{ matrix.acp_artifact }}

      - name: Upload ACP SHA-256 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.acp_artifact }}.sha256
          path: ${{ matrix.acp_artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            kannaka-windows-x86_64.exe/kannaka-windows-x86_64.exe
            kannaka-windows-x86_64.exe.sha256/kannaka-windows-x86_64.exe.sha256
            kannaka-linux-x86_64/kannaka-linux-x86_64
            kannaka-linux-x86_64.sha256/kannaka-linux-x86_64.sha256
            kannaka-linux-aarch64/kannaka-linux-aarch64
            kannaka-linux-aarch64.sha256/kannaka-linux-aarch64.sha256
            kannaka-macos-x86_64/kannaka-macos-x86_64
            kannaka-macos-x86_64.sha256/kannaka-macos-x86_64.sha256
            kannaka-macos-aarch64/kannaka-macos-aarch64
            kannaka-macos-aarch64.sha256/kannaka-macos-aarch64.sha256
            kannaka-acp-windows-x86_64.exe/kannaka-acp-windows-x86_64.exe
            kannaka-acp-windows-x86_64.exe.sha256/kannaka-acp-windows-x86_64.exe.sha256
            kannaka-acp-linux-x86_64/kannaka-acp-linux-x86_64
            kannaka-acp-linux-x86_64.sha256/kannaka-acp-linux-x86_64.sha256
            kannaka-acp-linux-aarch64/kannaka-acp-linux-aarch64
            kannaka-acp-linux-aarch64.sha256/kannaka-acp-linux-aarch64.sha256
            kannaka-acp-macos-x86_64/kannaka-acp-macos-x86_64
            kannaka-acp-macos-x86_64.sha256/kannaka-acp-macos-x86_64.sha256
            kannaka-acp-macos-aarch64/kannaka-acp-macos-aarch64
            kannaka-acp-macos-aarch64.sha256/kannaka-acp-macos-aarch64.sha256
          generate_release_notes: true

  # Distribution channels (GHCR image + npm) consume the release assets just
  # published above — see publish-channels.yml for triggers and secrets.
  publish-channels:
    needs: release
    uses: ./.github/workflows/publish-channels.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
