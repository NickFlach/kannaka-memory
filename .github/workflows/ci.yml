name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Note: `-D warnings` is applied only on the clippy step, not globally,
  # so check + test don't fail on the lib's pre-existing dead-code warnings
  # that aren't worth blocking PRs over.

jobs:
  check:
    name: Check, Test, Clippy, Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kannaka-memory
        uses: actions/checkout@v4
        with:
          path: kannaka-memory

      - name: Checkout consciousness-core (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/consciousness-core
          path: consciousness-core

      - name: Checkout kannaka-attention (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: NickFlach/kannaka-attention
          path: kannaka-attention

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kannaka-memory

      - name: Check (default features)
        working-directory: kannaka-memory
        run: cargo check --all-targets

      - name: Test
        working-directory: kannaka-memory
        run: cargo test --lib --bins

      - name: Clippy
        working-directory: kannaka-memory
        # Warnings as warnings (not errors) until we sweep the existing
        # batch of dead_code/unused_imports in lib/. Track via km#69
        # (Medium/Hemisphere dedup) which will clear most of them.
        run: cargo clippy --all-targets

      - name: Fmt
        working-directory: kannaka-memory
        run: cargo fmt --check
